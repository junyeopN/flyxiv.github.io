<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A9099"/></marker></defs><rect x="1" y="1" width="998" height="298" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="24" y="50" width="170" height="64" rx="10" fill="#EAF2FF" stroke="#4A7FD4" stroke-width="1.6"/><text x="109.0" y="79.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Live broadcast</text><text x="109.0" y="95.0" text-anchor="middle" font-size="11.5" fill="#6B7280">video stream</text><rect x="24" y="186" width="170" height="64" rx="10" fill="#EAF2FF" stroke="#4A7FD4" stroke-width="1.6"/><text x="109.0" y="215.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Live text commentary</text><text x="109.0" y="231.0" text-anchor="middle" font-size="11.5" fill="#6B7280">written by sports editors</text><rect x="272" y="50" width="260" height="64" rx="10" fill="#F4F5F7" stroke="#9AA0A6" stroke-width="1.6"/><text x="402.0" y="79.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Vision models</text><text x="402.0" y="95.0" text-anchor="middle" font-size="11.5" fill="#6B7280">when, and what kind of scene</text><rect x="272" y="186" width="260" height="64" rx="10" fill="#FDECEC" stroke="#D9534F" stroke-width="1.6"/><text x="402.0" y="215.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Commentary LLM</text><text x="402.0" y="231.0" text-anchor="middle" font-size="11.5" fill="#6B7280">what happened, and who</text><rect x="463" y="177" width="63" height="18" rx="9" fill="#D9534F"/><text x="494.5" y="190" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">my work</text><rect x="616" y="118" width="170" height="64" rx="10" fill="#F4F5F7" stroke="#9AA