<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A9099"/></marker></defs><rect x="1" y="1" width="998" height="418" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="20" y="30" width="450" height="360" rx="14" fill="#8E9AAF" fill-opacity="0.05" stroke="#8E9AAF" stroke-width="1.6"/><text x="34" y="52" font-size="13.5" fill="#374151"><tspan font-weight="700">As-is</tspan><tspan fill="#6B7280" font-weight="400"> (15 pods, 1 V100 each)</tspan></text><rect x="40" y="70" width="120" height="56" rx="10" fill="#EAF2FF" stroke="#4A7FD4" stroke-width="1.6"/><text x="100.0" y="95.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Image URLs</text><text x="100.0" y="111.0" text-anchor="middle" font-size="11.5" fill="#6B7280">batch of 1-16</text><rect x="180" y="70" width="120" height="56" rx="10" fill="#F4F5F7" stroke="#9AA0A6" stroke-width="1.6"/><text x="240.0" y="95.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Download</text><text x="240.0" y="111.0" text-anchor="middle" font-size="11.5" fill="#6B7280">CPU</text><rect x="320" y="70" width="130" height="56" rx="10" fill="#F4F5F7" stroke="#9AA0A6" stroke-width="1.6"/><text x="385.0" y="95.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Preprocess</text><text x="385.0" y="111.0" text-anchor="middle" font-size="11.5" fill="#6B7280">DALI on GPU</text><rect x="40" y="170" width="200" height="62" rx="10" fill="#FDECEC" stroke="#D9534F" stroke-width="1.6"/><text x="140.0" y="190.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">BestCrop</text><text x="140.0" y="206.0" text-anchor="middle" font-size="11.5" fill="#6B7280">model + OCR + face</text><text x="140.0" y="222.0" text-anchor="middle" font-size="11.5" fill="#6B7280">+ collage rules</text><rect x="260" y="170" width="190" height="62" rx="10" fill="#F4F5F7" stroke="#9AA0A6" stroke-width="1.6"/><text x="355.0" y="198.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Safety, aesthetic</text><text x="355.0" y="214.0" text-anchor="middle" font-size="11.5" fill="#6B7280">relevance, embedding</text><rect x="40" y="290" width="410" height="70" rx="10" fill="#F4F5F7" stroke="#9AA0A6" stroke-width="1.6"/><text x="245.0" y="314.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">One Triton ensemble per pod</text><text x="245.0" y="330.0" text-anchor="middle" font-size="11.5" fill="#6B7280">BestCrop = 55% of busy time, CPU at 3.6 / 4 cores</text><text x="245.0" y="346.0" text-anchor="middle" font-size="11.5" fill="#6B7280">-&gt; every model waits on BestCrop</text><path d="M160 98 L178 98" fill="none" stroke="#8A9099" stroke-width="1.6" marker-end="url(#arr)"/><path d="M300 98 L318 98" fill="none" stroke="#8A9099" stroke-width="1.6" marker-end="url(#arr)"/><path d="M385 126 L385 150 L140 150 L140 168" fill="none" stroke="#8A9099" stroke-width="1.6" marker-end="url(#arr)"/><path d="M385 150 L355 150 L355 168" fill="none" stroke="#8A9099" stroke-width="1.6" marker-end="url(#arr)"/><rect x="510" y="30" width="470" height="360" rx="14" fill="#8E9AAF" fill-opacity="0.05" stroke="#8E9AAF" stroke-width="1.6"/><text x="524" y="52" font-size="13.5" fill="#374151"><tspan font-weight="700">To-be</tspan><tspan fill="#6B7280" font-weight="400"> (split into two services)</tspan></text><rect x="530" y="64" width="430" height="140" rx="14" fill="#D9534F" fill-opacity="0.05" stroke="#D9534F" stroke-width="1.6"/><text x="544" y="86" font-size="13.5" fill="#374151"><tspan font-weight="700">Crop service</tspan><tspan fill="#6B7280" font-weight="400"> (4 pods)</tspan></text><rect x="546" y="104" width="120" height="64" rx="10" fill="#F4F5F7" stroke="#9AA0A6" stroke-width="1